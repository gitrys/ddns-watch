name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! A few facts help a lot.

        **Privacy:** ddns-watch never prints API keys, passwords or tokens, but the outputs below
        contain your hostname and IP addresses. If you do not want to show them publicly, replace
        them, e.g. with `example.com` and `x.x.x.x`. Never paste the contents of
        `/etc/ddns-watch/credentials/`.

        **Security problems** (e.g. a way to read the keys) please report privately, see
        [SECURITY.md](https://github.com/gitrys/ddns-watch/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: "After a reconnect the AAAA record was not updated. Expected: ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ddns-watch version
      description: Output of `ddns-watch --version`
      placeholder: ddns-watch 1.3.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Distribution and systemd version (`. /etc/os-release; echo $PRETTY_NAME; systemctl --version | head -1`)
      placeholder: Ubuntu 24.04.1 LTS, systemd 255
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: DNS provider plugin
      options: [netcup, strato, dyndns2, other / local plugin]
    validations:
      required: true
  - type: dropdown
    id: ipv4source
    attributes:
      label: IPv4 source (IPV4_SOURCE)
      options: [upnp, dns, interface, command, none (RECORDS=AAAA), "don't know"]
  - type: textarea
    id: status
    attributes:
      label: Output of `sudo ddns-watch status`
      render: text
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Output of `sudo ddns-watch check` (read-only, changes nothing)
      render: text
  - type: textarea
    id: log
    attributes:
      label: Log around the problem
      description: "`journalctl -u ddns-watch -u ddns-watch-ipv4 --since '-1h' --no-pager`"
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I am on the latest version (`sudo ddns-watch update`).
          required: true
        - label: The outputs above contain no keys, passwords, tokens or webhook URLs.
          required: true

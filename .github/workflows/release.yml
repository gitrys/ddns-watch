name: Release

# Push a tag like v1.0.0 (with a "## [1.0.0]" section in CHANGELOG.md) to publish a release.
# First the complete CI runs (same checks as for every push), then build, GitHub build
# attestation, release with tarball, install.sh and SHA256SUMS.
on:
  push:
    tags: ['v*']

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets: inherit

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check version and changelog
        run: |
          ver="${GITHUB_REF_NAME#v}"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3"; exit 1; }
          grep -q "^## \[$ver\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $ver"; exit 1; }
          echo "VER=$ver" >> "$GITHUB_ENV"

      - name: Build
        run: tools/build-release.sh "$VER" dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ddns-watch-*.tar.gz
            dist/install.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VER" '$0 ~ "^## \\[" v "\\]" { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md > notes.md
          {
            echo
            echo "**Install:** \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sudo bash\`"
            echo
            echo "**Update:** \`sudo ddns-watch update\`"
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/ddns-watch-*.tar.gz dist/install.sh dist/SHA256SUMS \
            --title "ddns-watch $VER" --notes-file notes.md

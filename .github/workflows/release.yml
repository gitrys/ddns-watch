name: Release

# Push a tag like v1.0.0 (with a "## [1.0.0]" section in CHANGELOG.md) to publish a release:
# tests, build, GitHub build attestation, release with tarball, install.sh and SHA256SUMS.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: shellcheck
        run: shellcheck -S warning -x ddns-watch.sh install.sh tests/run.sh tools/build-release.sh tools/sandbox-check.sh providers/*.sh

      - name: Tests
        run: tests/run.sh

      - name: Check version and changelog
        run: |
          ver="${GITHUB_REF_NAME#v}"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3"; exit 1; }
          grep -q "^## \[$ver\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $ver"; exit 1; }
          echo "VER=$ver" >> "$GITHUB_ENV"

      - name: Build
        run: tools/build-release.sh "$VER" dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/ddns-watch-*.tar.gz
            dist/install.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VER" '$0 ~ "^## \\[" v "\\]" { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md > notes.md
          {
            echo
            echo "**Install:** \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sudo bash\`"
            echo
            echo "**Update:** \`sudo ddns-watch update\`"
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/ddns-watch-*.tar.gz dist/install.sh dist/SHA256SUMS \
            --title "ddns-watch $VER" --notes-file notes.md
